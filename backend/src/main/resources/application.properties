spring.application.name=rtts

# Mailtrap SMTP
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Database Configuration (Fixed syntax)
spring.datasource.url=${RTTS_DATASOURCE_URL:jdbc:postgresql://localhost:5433/rtts}
spring.datasource.username=${RTTS_DATASOURCE_USERNAME:habib}
spring.datasource.password=${RTTS_DATASOURCE_PASSWORD:rtts1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Migration
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Security & Server
rtts.security.jwt.secret=${RTTS_JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
rtts.security.jwt.issuer=rtts
rtts.security.jwt.access-token-ttl=PT8H
server.port=8080

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB